<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Memory Match</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game-shell">
  <header class="game-header">
    <div>
      <p class="eyebrow">FRONTEND EDITION</p>
      <h1>Memory <span>Match</span></h1>
      <p class="subtitle">Pair every framework and sharpen your recall.</p>
    </div>
    <button class="restart-button" id="restart" type="button">New game <span aria-hidden="true">↻</span></button>
  </header>

  <div class="game-stats" aria-live="polite">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <strong id="moves">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">Pairs found</span>
      <strong><span id="matches">0</span><small> / 6</small></strong>
    </div>
    <div class="stat status-stat">
      <span class="stat-label">Status</span>
      <strong id="status">Ready to play</strong>
    </div>
  </div>

  <section class="memory-game" aria-label="Memory card game">
    <button class="memory-card" data-framework="react" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/react.svg" alt="React">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="react" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/react.svg" alt="React">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="angular" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/angular.svg" alt="Angular">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="angular" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/angular.svg" alt="Angular">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="ember" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/ember.svg" alt="Ember">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="ember" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/ember.svg" alt="Ember">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="vue" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/vue.svg" alt="Vue">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="vue" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/vue.svg" alt="Vue">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="backbone" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/backbone.svg" alt="Backbone">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="backbone" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/backbone.svg" alt="Backbone">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="aurelia" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/aurelia.svg" alt="Aurelia">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
    <button class="memory-card" data-framework="aurelia" type="button" aria-label="Hidden card">
      <img class="front-face" src="img/aurelia.svg" alt="Aurelia">
      <img class="back-face" src="img/js-badge.svg" alt="">
    </button>
  </section>
  <p class="hint"><span aria-hidden="true">✦</span> Find all six pairs to win</p>
</main>
    <script src="./scripts.js"></script>
</body>
</html>
